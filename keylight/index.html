<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keylight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the stage holds the canvas at the chosen frame shape; a glass control dock sits beneath it. */
:root {
  color-scheme: dark;
  --ink: #05060d;
  --panel: rgba(14, 16, 30, 0.72);
  --line: rgba(190, 200, 255, 0.14);
  --fg: #eef0ff;
  --muted: rgba(220, 225, 255, 0.58);
  --accent: #8fe8d8;
  --rec: #ff5a6a;
  --font-display: "Italiana", "Didot", "Bodoni 72", Georgia, serif;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--fg); font: 14px/1.4 var(--font-ui); overflow: hidden; transition: background .6s; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; padding: 16px 16px 0; }
#app.fill #stage, #app.clean #stage { padding: 0; }
#stage canvas { grid-area: 1 / 1; display: block; max-width: 100%; max-height: 100%; box-shadow: 0 0 0 1px var(--line); touch-action: none; }
#app.fill #stage canvas { box-shadow: none; }
#app.idle, #app.idle * { cursor: none; }

#dock {
  margin: 12px auto calc(12px + env(safe-area-inset-bottom, 0px));
  width: min(1040px, calc(100% - 32px)); box-sizing: border-box; flex: none;
  background: var(--panel); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px;
}
#app.clean #dock, #app.recording #dock { display: none; }
#app.fill #dock { position: absolute; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); margin: 0; transition: opacity .5s; }
#app.fill.idle #dock { opacity: 0; pointer-events: none; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 22px; letter-spacing: .04em; }
.song { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.song b { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song span { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.time { font: 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.6em; text-align: center; }
button, select, label.btn {
  font: 500 13px var(--font-ui); color: var(--fg); background: rgba(255,255,255,0.06);
  border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; line-height: 1.2;
}
button:hover, select:hover, label.btn:hover { background: rgba(255,255,255,0.12); }
button:focus-visible, select:focus-visible, input:focus-visible, label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
select option { background: #15172a; color: #eef0ff; }
#play { width: 40px; height: 40px; border-radius: 50%; padding: 0; justify-content: center; background: var(--fg); color: var(--ink); border: none; }
#play:hover { filter: brightness(1.1); background: var(--fg); }
#play svg { width: 16px; height: 16px; }
input[type=range] { accent-color: var(--accent); }
#scrub { flex: 1; min-width: 120px; }
.group { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.group input[type=range] { width: 80px; }
.worlds { display: inline-flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; flex-wrap: wrap; }
.worlds button { border: none; background: transparent; padding: 6px 10px; border-radius: 9px; }
.worlds button i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.worlds button[aria-pressed="true"] { background: var(--fg); color: var(--ink); }
#rec .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rec); }
.spacer { flex: 1; }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.hint { color: var(--muted); font-size: 12px; }

#bigPlay {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 84px; height: 84px; border-radius: 50%; padding: 0; justify-content: center;
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35); color: #fff;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
#bigPlay svg { width: 28px; height: 28px; margin-left: 4px; }
#drop {
  position: absolute; inset: 16px; border: 2px dashed var(--accent); border-radius: 24px;
  display: grid; place-items: center; font: 34px var(--font-display); letter-spacing: .04em;
  background: rgba(5,6,13,0.6); color: var(--fg); pointer-events: none;
}
#toast {
  position: absolute; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); max-width: calc(100% - 32px); box-sizing: border-box; font-size: 13px;
}
#toast a { color: var(--accent); }
#recBadge {
  position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; gap: 8px; align-items: center;
  font: 12px var(--font-mono); color: #fff; background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 999px;
}
#recBadge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); animation: pulse 1s infinite; }
#recBadge button { padding: 3px 8px; font-size: 12px; }
@keyframes pulse { 50% { opacity: .25; } }
@media (max-width: 640px) {
  .brand { font-size: 19px; }
  .group input[type=range] { width: 60px; }
  #dock { padding: 10px; gap: 8px; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { #app.fill #dock { transition: none; } #recBadge .dot { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl" aria-label="3D piano visualization"></canvas>
    <canvas id="cv2d" aria-label="Piano visualization" hidden></canvas>
    <button id="bigPlay" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg></button>
    <div id="drop" hidden>Drop a MIDI file</div>
    <div id="recBadge" hidden><span class="dot"></span><span id="recTime">REC 0:00</span><button id="recStop" type="button">Stop</button></div>
  </div>

  <div id="dock">
    <div class="row">
      <button id="play" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path id="playIcon" d="M6 4l15 8-15 8z"/></svg></button>
      <span class="time" id="tCur">0:00</span>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Position">
      <span class="time" id="tDur">0:00</span>
    </div>
    <div class="row">
      <span class="brand">Keylight</span>
      <div class="song"><b id="songName">Late Light</b><span id="songWhy"></span></div>
      <label class="btn" for="file">Open MIDI<input type="file" id="file" accept=".mid,.midi,audio/midi,audio/x-midi"></label>
      <button id="demo" type="button" class="hide-sm">Demo</button>
    </div>
    <div class="row">
      <div class="worlds" id="worlds" role="group" aria-label="World"></div>
      <select id="classic" aria-label="Classic 2D styles">
        <option value="">Classic 2D…</option>
        <option value="aurora">Aurora</option>
        <option value="sumi">Sumi ink</option>
        <option value="stars">Constellation</option>
        <option value="dusk">Dusk</option>
      </select>
      <span class="hint hide-sm" id="orbitHint">Drag to look around</span>
    </div>
    <div class="row">
      <select id="aspect" aria-label="Frame shape">
        <option value="9:16">9:16 TikTok</option>
        <option value="16:9">16:9 Wide</option>
        <option value="1:1">1:1 Square</option>
        <option value="fill">Fill window</option>
      </select>
      <select id="range" aria-label="Keyboard range">
        <option value="auto">Keys: fit song</option>
        <option value="88">Keys: all 88</option>
      </select>
      <span class="group">Speed <input type="range" id="speed" min="0.5" max="1.5" step="0.05" value="1" aria-label="Playback speed"></span>
      <span class="group hide-sm">Fall <input type="range" id="fall" min="1.2" max="5" step="0.1" value="2.4" aria-label="Seconds of notes visible before they land"></span>
      <span class="spacer"></span>
      <button id="poster" type="button">Save artwork</button>
      <button id="rec" type="button"><span class="dot"></span>Record video</button>
      <button id="fs" type="button" class="hide-sm" aria-label="Fullscreen">⛶</button>
    </div>
  </div>
  <div id="toast" hidden></div>
</div>

<!-- three.js r147: the last release that ships classic-script builds of the add-ons -->
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="piano-samples.js"></script>
<script src="js/core.js"></script>
<script src="js/midi.js"></script>
<script src="js/audio.js"></script>
<script src="js/classic.js"></script>
<script src="js/world3d.js"></script>
<script src="js/worlds.js"></script>
<script src="js/app.js"></script>
</body>
</html>
