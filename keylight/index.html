<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keylight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed stage holding the canvas, with a floating glass control dock that hides while music plays. */
:root {
  color-scheme: dark;
  --ink: #05060d;         /* stage surround */
  --panel: rgba(14, 16, 30, 0.72);
  --line: rgba(190, 200, 255, 0.14);
  --fg: #eef0ff;
  --muted: rgba(220, 225, 255, 0.58);
  --accent: #8fe8d8;
  --rec: #ff5a6a;
  --font-display: "Italiana", "Didot", "Bodoni 72", Georgia, serif;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--fg); font: 14px/1.4 var(--font-ui); overflow: hidden; transition: background .6s; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; padding: 16px 16px 0; }
#app.fill #stage, #app.clean #stage { padding: 0; }
#cv { display: block; max-width: 100%; max-height: 100%; box-shadow: 0 0 0 1px var(--line); }
#app.fill #cv { box-shadow: none; }
#app.idle, #app.idle * { cursor: none; }

/* control dock */
#dock {
  margin: 12px auto calc(12px + env(safe-area-inset-bottom, 0px));
  width: min(980px, calc(100% - 32px)); box-sizing: border-box; flex: none;
  background: var(--panel); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px;
}
#app.clean #dock, #app.recording #dock { display: none; }
#app.fill #dock { position: absolute; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); margin: 0; transition: opacity .5s; }
#app.fill.idle #dock { opacity: 0; pointer-events: none; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 22px; letter-spacing: .04em; margin-right: 4px; }
.song { color: var(--muted); font-size: 13px; min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.time { font: 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.6em; text-align: center; }
button, select, label.btn {
  font: 500 13px var(--font-ui); color: var(--fg); background: rgba(255,255,255,0.06);
  border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; line-height: 1.2;
}
button:hover, select:hover, label.btn:hover { background: rgba(255,255,255,0.12); }
button:focus-visible, select:focus-visible, input:focus-visible, label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
select option { background: #15172a; color: #eef0ff; }
#play { width: 40px; height: 40px; border-radius: 50%; padding: 0; justify-content: center; background: var(--fg); color: var(--ink); border: none; }
#play:hover { filter: brightness(1.1); background: var(--fg); }
#play svg { width: 16px; height: 16px; }
input[type=range] { accent-color: var(--accent); }
#scrub { flex: 1; min-width: 120px; }
.group { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.group input[type=range] { width: 86px; }
.themes { display: inline-flex; gap: 6px; }
.chip { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid transparent; justify-content: center; }
.chip[aria-pressed="true"] { border-color: var(--fg); }
.chip span { width: 20px; height: 20px; border-radius: 50%; display: block; }
#rec .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rec); }
.spacer { flex: 1; }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }

#bigPlay {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 84px; height: 84px; border-radius: 50%; padding: 0; justify-content: center;
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35); color: #fff;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
#bigPlay svg { width: 28px; height: 28px; margin-left: 4px; }
#drop {
  position: absolute; inset: 16px; border: 2px dashed var(--accent); border-radius: 24px;
  display: grid; place-items: center; font: 34px var(--font-display); letter-spacing: .04em;
  background: rgba(5,6,13,0.6); color: var(--fg); pointer-events: none;
}
#toast {
  position: absolute; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); max-width: calc(100% - 32px); box-sizing: border-box;
  font-size: 13px; display: flex; gap: 10px; align-items: center;
}
#toast a { color: var(--accent); }
#recBadge {
  position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; gap: 8px; align-items: center;
  font: 12px var(--font-mono); color: #fff; background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 999px;
}
#recBadge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); animation: pulse 1s infinite; }
#recBadge button { padding: 3px 8px; font-size: 12px; }
@keyframes pulse { 50% { opacity: .25; } }
@media (max-width: 640px) {
  .brand { font-size: 19px; }
  .group input[type=range] { width: 64px; }
  #dock { padding: 10px; gap: 8px; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { #app.fill #dock { transition: none; } #recBadge .dot { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" aria-label="Piano visualization"></canvas>
    <button id="bigPlay" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg></button>
    <div id="drop" hidden>Drop a MIDI file</div>
    <div id="recBadge" hidden><span class="dot"></span><span id="recTime">REC 0:00</span><button id="recStop" type="button">Stop</button></div>
  </div>

  <div id="dock">
    <div class="row">
      <button id="play" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path id="playIcon" d="M6 4l15 8-15 8z"/></svg></button>
      <span class="time" id="tCur">0:00</span>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Position">
      <span class="time" id="tDur">0:00</span>
    </div>
    <div class="row">
      <span class="brand">Keylight</span>
      <span class="song" id="songName">Demo</span>
      <label class="btn" for="file">Open MIDI<input type="file" id="file" accept=".mid,.midi,audio/midi,audio/x-midi"></label>
      <button id="demo" type="button" class="hide-sm">Demo</button>
    </div>
    <div class="row">
      <div class="themes" id="themes" role="group" aria-label="Visual style"></div>
      <select id="aspect" aria-label="Frame shape">
        <option value="9:16">9:16 TikTok</option>
        <option value="16:9">16:9 Wide</option>
        <option value="1:1">1:1 Square</option>
        <option value="fill">Fill window</option>
      </select>
      <select id="range" aria-label="Keyboard range">
        <option value="auto">Keys: fit song</option>
        <option value="88">Keys: all 88</option>
      </select>
      <span class="group">Speed <input type="range" id="speed" min="0.5" max="1.5" step="0.05" value="1" aria-label="Playback speed"></span>
      <span class="group hide-sm">Fall <input type="range" id="fall" min="1.2" max="5" step="0.1" value="2.6" aria-label="Fall length in seconds"></span>
      <span class="spacer"></span>
      <button id="rec" type="button"><span class="dot"></span>Record video</button>
      <button id="fs" type="button" class="hide-sm" aria-label="Fullscreen">⛶</button>
    </div>
  </div>
  <div id="toast" hidden></div>
</div>

<script>
"use strict";
/* ============================================================
   MIDI parsing
   ============================================================ */
function parseMidi(buf) {
  const d = new DataView(buf);
  let p = 0;
  const u8 = () => d.getUint8(p++);
  const u16 = () => { const v = d.getUint16(p); p += 2; return v; };
  const u32 = () => { const v = d.getUint32(p); p += 4; return v; };
  const id = () => String.fromCharCode(u8(), u8(), u8(), u8());
  const vlq = () => { let v = 0, b; do { b = u8(); v = (v << 7) | (b & 0x7f); } while (b & 0x80); return v; };

  // Find the header (some files are wrapped in RIFF)
  const bytes = new Uint8Array(buf);
  let start = -1;
  for (let i = 0; i < Math.min(bytes.length - 4, 4096); i++) {
    if (bytes[i] === 0x4d && bytes[i + 1] === 0x54 && bytes[i + 2] === 0x68 && bytes[i + 3] === 0x64) { start = i; break; }
  }
  if (start < 0) throw new Error("not a MIDI file");
  p = start + 4;
  const hlen = u32(); const hEnd = p + hlen;
  u16(); const ntrks = u16(); const division = u16();
  p = hEnd;

  let smpteTps = 0;
  if (division & 0x8000) smpteTps = (256 - (division >> 8)) * (division & 0xff);

  const ev = []; // {tick, kind, ...}
  let order = 0;
  const names = [];
  for (let t = 0; t < ntrks && p + 8 <= d.byteLength; t++) {
    const cid = id(); const len = u32(); const end = Math.min(p + len, d.byteLength);
    if (cid !== "MTrk") { p = end; continue; }
    let tick = 0, running = 0;
    while (p < end) {
      tick += vlq();
      let st = d.getUint8(p);
      if (st & 0x80) p++; else st = running;
      if (st === 0xff) {
        const type = u8(); const l = vlq(); const dataStart = p;
        if (type === 0x51 && l >= 3) ev.push({ tick, k: 0, o: order++, tempo: (d.getUint8(p) << 16) | (d.getUint8(p + 1) << 8) | d.getUint8(p + 2) });
        else if ((type === 0x03 || type === 0x01) && names.length < 8) {
          let s = ""; for (let i = 0; i < l && i < 80; i++) s += String.fromCharCode(d.getUint8(p + i));
          if (type === 0x03) names.push(s.trim());
        }
        p = dataStart + l;
        if (type === 0x2f) break;
      } else if (st === 0xf0 || st === 0xf7) {
        p += vlq();
      } else if (st & 0x80) {
        running = st;
        const hi = st & 0xf0, ch = st & 0x0f;
        const a = u8();
        const b = (hi === 0xc0 || hi === 0xd0) ? 0 : u8();
        if (hi === 0x90 && b > 0) ev.push({ tick, k: 3, o: order++, ch, pitch: a, vel: b, track: t });
        else if (hi === 0x80 || hi === 0x90) ev.push({ tick, k: 1, o: order++, ch, pitch: a });
        else if (hi === 0xb0 && a === 64) ev.push({ tick, k: 2, o: order++, ch, val: b });
      } else { break; } // corrupt data: stop this track
    }
    p = end;
  }
  ev.sort((x, y) => x.tick - y.tick || x.k - y.k || x.o - y.o);

  // ticks -> seconds through the tempo map
  let tempo = 500000, lastTick = 0, lastSec = 0, firstTempo = null;
  const tps = () => smpteTps || (division / (tempo / 1e6));
  for (const e of ev) {
    lastSec += (e.tick - lastTick) / tps();
    lastTick = e.tick;
    e.sec = lastSec;
    if (e.k === 0) { tempo = e.tempo; if (firstTempo === null) firstTempo = tempo; }
  }

  // pair note on/off, track sustain pedal for audio release
  const open = new Map(), notes = [];
  const pedal = new Array(16).fill(false), held = Array.from({ length: 16 }, () => []);
  for (const e of ev) {
    if (e.k === 3) {
      const key = e.ch * 128 + e.pitch;
      if (!open.has(key)) open.set(key, []);
      const n = { pitch: e.pitch, start: e.sec, end: e.sec, vel: e.vel / 127, ch: e.ch, track: e.track, aEnd: e.sec };
      open.get(key).push(n); notes.push(n);
    } else if (e.k === 1) {
      const q = open.get(e.ch * 128 + e.pitch);
      if (q && q.length) {
        const n = q.shift(); n.end = n.aEnd = e.sec;
        if (pedal[e.ch]) held[e.ch].push(n);
      }
    } else if (e.k === 2) {
      const down = e.val >= 64;
      if (!down && pedal[e.ch]) { for (const n of held[e.ch]) n.aEnd = Math.max(n.aEnd, e.sec); held[e.ch].length = 0; }
      pedal[e.ch] = down;
    }
  }
  for (const q of open.values()) for (const n of q) { n.end = n.aEnd = Math.max(n.start + 0.5, lastSec); }
  for (const c of held) for (const n of c) n.aEnd = Math.max(n.aEnd, lastSec);

  let out = notes.filter(n => n.ch !== 9); // drop GM drum channel
  if (!out.length) out = notes;
  for (const n of out) {
    if (n.end - n.start < 0.04) n.end = n.start + 0.04;
    n.end = Math.min(n.end, n.start + 30);
    n.aEnd = Math.max(n.aEnd, n.end);
  }
  out.sort((a, b) => a.start - b.start || a.pitch - b.pitch);
  return { notes: out, bpm: Math.round(60e6 / (firstTempo || 500000)), name: names.find(s => s && !/^(track|untitled)/i.test(s)) || "" };
}

/* ============================================================
   Demo piece (an original, generated in code)
   ============================================================ */
function makeDemo() {
  const bpm = 76, beat = 60 / bpm, notes = [];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const add = (b, pitch, len, vel) => {
    const h = (rnd() - 0.5) * 0.016;
    const s = b * beat + h;
    notes.push({ pitch, start: s, end: s + len * beat * 0.96, aEnd: s + len * beat * 1.15, vel: Math.min(1, vel + (rnd() - 0.5) * 0.08), ch: 0, track: 0 });
  };
  const chords = { Am: [45, 3], F: [41, 4], C: [48, 4], G: [43, 4], Em: [40, 3], Dm: [38, 3] };
  const prog = ["Am", "F", "C", "G", "Am", "F", "C", "G", "F", "G", "Em", "Am", "F", "G", "Am", "C"];
  // left hand: rolling arpeggio, 8ths, held like a pedal
  prog.forEach((c, bar) => {
    const [r, third] = chords[c];
    const pat = [r, r + 7, r + 12, r + 12 + third, r + 19, r + 12 + third, r + 12, r + 7];
    pat.forEach((pp, i) => add(bar * 4 + i * 0.5, pp, i === 0 ? 4 : 2.2 - i * 0.2, i === 0 ? 0.58 : 0.4));
    if (bar >= 8) { // mid-register chord pad in the second half
      const tri = [r + 24, r + 24 + third, r + 31].map(x => x > 76 ? x - 12 : x);
      tri.forEach(pp => add(bar * 4, pp, 3.6, 0.36));
    }
  });
  const M = { C4: 60, D4: 62, E4: 64, F4: 65, G4: 67, A4: 69, B4: 71, C5: 72, D5: 74, E5: 76, F5: 77, G5: 79, A5: 81, B5: 83, C6: 84, D6: 86, E6: 88 };
  const mel = [
    ["E5", 1], ["D5", .5], ["C5", .5], ["D5", 1], ["E5", 1],
    ["C5", 1.5], ["A4", .5], ["C5", 1], ["F5", 1],
    ["E5", 1.5], ["G5", .5], ["E5", 1], ["D5", 1],
    ["D5", 2], ["B4", 1], ["D5", 1],
    ["E5", 1], ["A5", 1], ["G5", .5], ["E5", .5], ["D5", 1],
    ["C5", 1], ["D5", .5], ["E5", .5], ["F5", 1], ["A5", 1],
    ["G5", 1.5], ["E5", .5], ["C5", 1], ["E5", 1],
    ["D5", 3], [null, 1],
    ["A5", 1], ["C6", 1], ["A5", 1], ["G5", 1],
    ["G5", 1.5], ["D5", .5], ["G5", 1], ["B5", 1],
    ["B5", 1.5], ["G5", .5], ["E5", 1], ["G5", 1],
    ["A5", 2], ["E5", 1], ["C6", 1],
    ["C6", 1], ["A5", 1], ["F5", 1], ["A5", 1],
    ["B5", 1], ["D6", 1], ["B5", 1], ["G5", 1],
    ["C6", 1.5], ["B5", .5], ["A5", 1], ["E5", 1],
    ["E5", 1], [null, 3]
  ];
  let b = 0;
  for (const [n, len] of mel) { if (n) add(b, M[n], len, 0.8 + (len >= 1.5 ? 0.06 : 0)); b += len; }
  // sparkle runs into bars 13 and 16
  [[47, [69, 72, 76, 81, 84, 88]], [59, [72, 76, 79, 84, 88, 91]]].forEach(([at, run]) => run.forEach((pp, i) => add(at + i * 0.16, pp, 0.5, 0.5 + i * 0.05)));
  // closing rolled chord across the keyboard
  [36, 43, 48, 52, 55, 60, 64, 67, 72, 76, 79, 84].forEach((pp, i) => add(64 + i * 0.09, pp, 6 - i * 0.1, 0.55 + i * 0.02));
  notes.sort((a, b) => a.start - b.start || a.pitch - b.pitch);
  return { notes, bpm, name: "Late Light" };
}

/* ============================================================
   Synth — a light piano voice built from oscillators
   ============================================================ */
const synth = {
  ctx: null, voices: [],
  ensure() {
    if (this.ctx) { if (this.ctx.state !== "running") this.ctx.resume(); return this.ctx; }
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = this.ctx = new AC({ latencyHint: "interactive" });
    this.bus = ctx.createGain();
    const master = ctx.createGain(); master.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.25;
    const verb = ctx.createConvolver(); verb.buffer = this.impulse(2.8);
    const wet = ctx.createGain(); wet.gain.value = 0.3;
    this.bus.connect(master); this.bus.connect(verb); verb.connect(wet); wet.connect(master);
    master.connect(comp); comp.connect(ctx.destination);
    this.out = comp;
    const N = 14, re = new Float32Array(N + 1), im = new Float32Array(N + 1);
    const amps = [0, 1, 0.42, 0.26, 0.14, 0.11, 0.06, 0.05, 0.03, 0.025, 0.015, 0.012, 0.008, 0.006, 0.004];
    for (let i = 1; i <= N; i++) im[i] = amps[i] || 0;
    this.wave = ctx.createPeriodicWave(re, im);
    const nb = ctx.createBuffer(1, ctx.sampleRate * 0.25, ctx.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    this.noise = nb;
    return ctx;
  },
  impulse(sec) {
    const ctx = this.ctx, len = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c); let lp = 0;
      for (let i = 0; i < len; i++) {
        const t = i / len;
        lp += (Math.random() * 2 - 1 - lp) * (0.55 - t * 0.4);
        d[i] = i < ctx.sampleRate * 0.012 ? 0 : lp * Math.pow(1 - t, 3.2);
      }
    }
    return buf;
  },
  recStream() {
    if (!this.recDest) { this.recDest = this.ctx.createMediaStreamDestination(); this.out.connect(this.recDest); }
    return this.recDest.stream;
  },
  play(pitch, vel, when, end) {
    const ctx = this.ctx;
    when = Math.max(when, ctx.currentTime);
    end = Math.max(end, when + 0.05);
    // a re-struck key cuts off its previous ring
    for (const v of this.voices) if (v.p === pitch && v.end > when) this.cut(v, when, 0.03);
    if (this.voices.length > 120) this.cut(this.voices[0], ctx.currentTime, 0.02);

    const f = 440 * Math.pow(2, (pitch - 69) / 12);
    const g = ctx.createGain(); g.gain.value = 0;
    const flt = ctx.createBiquadFilter(); flt.type = "lowpass"; flt.Q.value = 0.5;
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), o2g = ctx.createGain();
    o1.setPeriodicWave(this.wave); o2.setPeriodicWave(this.wave);
    o1.frequency.value = o2.frequency.value = f;
    o2.detune.value = 3 + Math.max(0, (pitch - 60) * 0.05); o2g.gain.value = 0.55;
    o1.connect(flt); o2.connect(o2g); o2g.connect(flt); flt.connect(g);
    let tail = g;
    if (ctx.createStereoPanner) { const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-0.5, Math.min(0.5, (pitch - 64) / 70)); g.connect(pan); tail = pan; }
    tail.connect(this.bus);

    const loudness = Math.pow(0.15 + vel * 0.85, 1.6) * (pitch < 48 ? 1.15 : 1) * (pitch > 84 ? 0.8 : 1);
    const peak = 0.11 * loudness;
    const tau = Math.max(0.3, Math.min(4.5, 3.4 * Math.pow(f / 110, -0.55)));
    const gp = g.gain;
    gp.setValueAtTime(0, when);
    gp.linearRampToValueAtTime(peak, when + 0.004);
    gp.setTargetAtTime(peak * 0.42, when + 0.005, 0.14);
    if (end > when + 0.45) gp.setTargetAtTime(0, when + 0.45, tau);
    gp.setTargetAtTime(0, end, 0.08);
    const bright = Math.min(17000, f * (3 + vel * 10) + 600);
    flt.frequency.setValueAtTime(bright, when);
    flt.frequency.setTargetAtTime(Math.min(bright, f * 1.6 + 350), when + 0.01, 0.3 + tau * 0.15);

    // felt hammer thump
    const nz = ctx.createBufferSource(); nz.buffer = this.noise;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = Math.min(f * 3, 8000); bp.Q.value = 0.9;

  b.className = "chip"; b.type = "button"; b.dataset.t = name; b.title = `${THEMES[name].label} (${i + 1})`; b.setAttribute("aria-label", THEMES[name].label);
  b.innerHTML = `<span style="background:${THEMES[name].swatch}"></span>`;
  b.onclick = () => setTheme(name);
  themesEl.appendChild(b);
});

const RES = { "9:16": [1080, 1920], "16:9": [1920, 1080], "1:1": [1440, 1440] };
function resize() {
  const mode = $("aspect").value;
  app.classList.toggle("fill", mode === "fill");
  if (mode === "fill") {
    const st = $("stage").getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(st.width * dpr); cv.height = Math.round(st.height * dpr);
    cv.style.width = st.width + "px"; cv.style.height = st.height + "px";
  } else {
    const [w, h] = RES[mode];
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    const st = $("stage").getBoundingClientRect(), k = Math.min(st.width / w, st.height / h);
    cv.style.width = Math.floor(w * k) + "px"; cv.style.height = Math.floor(h * k) + "px";
  }
  R.keys = [];
}
window.addEventListener("resize", resize);

function loadSong(parsed, fallbackName) {
  if (!parsed.notes.length) { ui.toast("That file has no notes to play. Try another MIDI file."); return; }
  const t0 = parsed.notes[0].start;
  for (const n of parsed.notes) { n.start -= t0; n.end -= t0; n.aEnd -= t0; }
  let end = 0; for (const n of parsed.notes) end = Math.max(end, n.end);
  const title = (fallbackName || parsed.name || "Untitled").replace(/\.(mid|midi)$/i, "").replace(/[_-]+/g, " ").trim();
  player.load({ notes: parsed.notes, bpm: parsed.bpm, title, duration: end + 1.2 });
  $("songName").textContent = title; $("tDur").textContent = fmt(end + 1.2);
  ui.sync();
}
async function openFile(file) {
  if (!file) return;
  try { loadSong(parseMidi(await file.arrayBuffer()), file.name); }
  catch (e) { ui.toast("That file couldn't be read as MIDI. Pick a .mid or .midi file."); }
}
$("file").addEventListener("change", e => { openFile(e.target.files[0]); e.target.value = ""; });
$("demo").onclick = () => loadSong(makeDemo(), "Late Light");
const toggle = () => player.playing ? player.pause() : player.play();
$("play").onclick = toggle; $("bigPlay").onclick = toggle;
$("aspect").onchange = () => { resize(); try { localStorage.setItem("keylight.aspect", $("aspect").value); } catch (e) {} };
$("range").onchange = () => { R.layout(player.song, $("range").value); R.keys = []; };
$("speed").oninput = e => player.setSpeed(+e.target.value);
$("fall").oninput = e => { R.lookahead = +e.target.value; };
$("fs").onclick = () => { const el = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen && el.requestFullscreen())?.catch?.(() => {}); };
let scrubbing = false;
$("scrub").addEventListener("input", e => { scrubbing = true; if (player.song) player.seek(-LEAD + (+e.target.value / 1000) * (player.song.duration + LEAD)); });
$("scrub").addEventListener("change", () => scrubbing = false);

// drag and drop
let dragDepth = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; $("drop").hidden = false; });
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("drop").hidden = true; } });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("drop").hidden = true; openFile(e.dataTransfer.files[0]); });

// keyboard shortcuts
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowRight" && player.song) player.seek(player.time() + 5);
  else if (e.key === "ArrowLeft" && player.song) player.seek(player.time() - 5);
  else if (/^[1-4]$/.test(e.key)) setTheme(THEME_ORDER[+e.key - 1]);
  else if (e.key === "f" || e.key === "F") $("fs").click();
  else if (e.key === "h" || e.key === "H") { app.classList.toggle("clean"); resize(); }
  else if (e.key === "Escape" && app.classList.contains("clean")) { app.classList.remove("clean"); resize(); }
});

// hide the dock while music plays and the pointer rests
let idleTimer;
function wake() { app.classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (player.playing) app.classList.add("idle"); }, 2600); }
["mousemove", "pointerdown", "keydown", "touchstart"].forEach(ev => window.addEventListener(ev, wake, { passive: true }));

/* ============================================================
   Video recording (canvas + synth audio)
   ============================================================ */
const recorder = {
  active: false,
  start() {
    if (!player.song) return;
    if (!window.MediaRecorder || !cv.captureStream) { ui.toast("This browser can't record video. Try Chrome, Edge or Safari."); return; }
    synth.ensure();
    const types = ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
    const type = types.find(t => MediaRecorder.isTypeSupported(t)) || "";
    const stream = new MediaStream([...cv.captureStream(60).getVideoTracks(), ...synth.recStream().getAudioTracks()]);
    let mr;
    try { mr = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 14e6, audioBitsPerSecond: 192e3 }); }
    catch (e) { ui.toast("Recording couldn't start in this browser."); return; }
    this.chunks = []; this.mr = mr; this.type = type || "video/webm"; this.active = true; this.t0 = performance.now();
    mr.ondataavailable = e => e.data.size && this.chunks.push(e.data);
    mr.onstop = () => this.finish();
    player.seek(-LEAD); R.resetFx();
    app.classList.add("recording"); $("recBadge").hidden = false; resize();
    mr.start(250); player.play(); ui.sync();
  },
  stop() { if (!this.active) return; this.active = false; player.pause(); try { this.mr.stop(); } catch (e) {} },
  finish() {
    app.classList.remove("recording"); $("recBadge").hidden = true; resize();
    const blob = new Blob(this.chunks, { type: this.type });
    const ext = this.type.includes("mp4") ? "mp4" : "webm";
    const name = `${(player.song.title || "keylight").replace(/[^\w\- ]+/g, "").trim() || "keylight"} - ${R.theme.label}.${ext}`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    ui.toast(`Saved <b>${name.replace(/</g, "")}</b>. If the download didn't start, <a href="${url}" download="${name.replace(/"/g, "")}">save it here</a>.`, 0);
    ui.sync();
  }
};
$("rec").onclick = () => recorder.start();
$("recStop").onclick = () => recorder.stop();

/* ============================================================
   Main loop
   ============================================================ */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const song = player.song;
  let t = player.time();
  if (player.playing && song && t >= song.duration) { if (recorder.active) recorder.stop(); else player.pause(); player.anchorSong = song.duration; t = song.duration; ui.sync(); }
  R.frame(song, t, player.playing ? dt * player.speed : dt * 0.5, now / 1000);
  if (song) {
    $("tCur").textContent = fmt(t);
    if (!scrubbing) $("scrub").value = Math.round(((t + LEAD) / (song.duration + LEAD)) * 1000);
    if (recorder.active) $("recTime").textContent = "REC " + fmt((now - recorder.t0) / 1000);
  }
  requestAnimationFrame(loop);
}

// boot
(function boot() {
  let theme = "aurora", aspect = "9:16";
  try { theme = localStorage.getItem("keylight.theme") || theme; aspect = localStorage.getItem("keylight.aspect") || aspect; } catch (e) {}
  if (!THEMES[theme]) theme = "aurora";
  if ([...$("aspect").options].some(o => o.value === aspect)) $("aspect").value = aspect;
  setTheme(theme); resize();
  loadSong(makeDemo(), "Late Light");
  requestAnimationFrame(loop);
  (document.fonts && document.fonts.ready || Promise.resolve()).then(() => { R.keys = []; });
})();
</script>
</body>
</html>
