  "notes": "# Mitosis & stem cells\n## Chromosomes\n The nucleus of a cell contains chromosomes made of DNA.\n Each chromosome carries a large number of genes. In body\n cells, chromosomes are normally found in pairs.\n## The cell cycle\n Body cells divide in a series of stages called the cell cycle:\n Growth and DNA copyingThe cell grows and makes more ribosomes and mitochondria. It copies its DNA, so each chromosome now has two copies.\n MitosisOne set of chromosomes is pulled to each end of the cell, and the nucleus divides.\n DivisionThe cytoplasm and cell membrane divide, forming two cells that are genetically identical to the parent cell.\n Cell division by mitosis is needed for growth, repair and asexual reproduction.\n Exam tip: Use the exact phrase \"genetically identical\".\n Just saying \"the same\" can lose the mark.\n## Stem cells\n A stem cell is an undifferentiated cell. It can divide\n to make more cells like itself, and it can differentiate into other types of cell.\n Type | Found in | Can become | \n Embryonic stem cells | Human embryos | Almost any type of cell | \n Adult stem cells | e.g. bone marrow | Many types of cell, including blood cells | \n Meristem | Tips of plant roots and shoots | Any type of plant cell, throughout the plant's life | \n### Uses\n Treating conditions such as diabetes and paralysis by replacing faulty cells.\n Therapeutic cloning: an embryo is made with the same genes as the patient, so its stem cells aren't rejected by the patient's body.\n Cloning plants from meristem tissue, quickly and cheaply, e.g. to save rare species from extinction or to grow large numbers of crops with useful features such as disease resistance.\n### Benefits and risks\n Benefits | Risks and issues | \n Could treat diseases with no current cure | Viral infections could be passed on with the stem cells | \n Therapeutic cloning avoids rejection | Some people have ethical or religious objections to using embryos | \n Exam tip: \"Evaluate\" questions want both sides,\n then a conclusion that says which side you think is stronger and why.\nKey words: Chromosome: A long strand of DNA, found in the nucleus, carrying many genes.; Gene: A small section of DNA on a chromosome.; Mitosis: The stage of the cell cycle when the nucleus divides.; Stem cell: An undifferentiated cell that can become other types of cell.; Meristem: Plant tissue containing stem cells, at root and shoot tips.; Therapeutic cloning: Making an embryo with the patient's genes, to give stem cells that won't be rejected."
