  "notes": "# Diffusion & exchange surfaces\n## What is diffusion?\n Diffusion is the spreading out of the particles of a gas\n or a solution, resulting in a net movement from an area of\n higher concentration to an area of lower\n concentration. It happens because particles are always moving\n randomly. It doesn't need energy from the cell.\n Particles spread out across the cell membrane (dashed line) until the concentration is even.\n Examples of diffusion in living things:\n Oxygen and carbon dioxide moving in and out of cells during gas exchange\n The waste product urea moving from cells into the blood plasma, to be removed by the kidneys\n## What speeds up diffusion?\n Factor | Effect | \n Concentration gradient | A bigger difference in concentration → faster diffusion | \n Temperature | Higher temperature → particles move faster → faster diffusion | \n Surface area of the membrane | Larger surface area → more room for particles to cross → faster diffusion | \n## Surface area to volume ratio\n A single-celled organism has a large surface area compared with its\n volume, so diffusion across its surface is enough to meet its needs.\n Bigger organisms have a smaller surface area to volume ratio, so\n they need exchange surfaces and transport systems.\n Worked example\n Find the surface area to volume ratio of a 2 cm cube.\n Surface area = 6 faces × (2 × 2) = 24 cm²\n Volume = 2 × 2 × 2 = 8 cm³\n Ratio = 24 : 8 = 3 : 1\n A 1 cm cube has a ratio of 6 : 1, so the bigger cube has the smaller ratio.\n## Exchange surfaces\n A good exchange surface has:\n a large surface area\n a thin membrane, so particles only diffuse a short distance\n an efficient blood supply (in animals), to keep the concentration gradient steep\n ventilation, for gas exchange (in animals)\n Where | Adaptation | \n Small intestine | Millions of villi give a huge surface area; good blood supply | \n Lungs | Millions of alveoli with thin walls; good blood supply; ventilated by breathing | \n Fish gills | Thin filaments with a large surface area and many blood vessels | \n Plant roots | Root hair cells give a large surface area | \n Leaves | Flat and thin, with stomata that let gases in and out |\nKey words: Diffusion: The net movement of particles from an area of higher concentration to an area of lower concentration.; Concentration gradient: The difference in concentration between two areas.; Surface area to volume ratio: How much surface an object has compared with its size.; Exchange surface: A surface adapted for substances to pass through it, e.g. the alveoli.\n\n# Osmosis & active transport\n## Osmosis\n Osmosis is the diffusion of water from a dilute solution\n to a concentrated solution through a partially permeable\n membrane. The membrane lets water through but not larger\n dissolved particles.\n A dilute solution has a lot of water and a little dissolved substance.\n A concentrated solution has less water and more dissolved substance.\n Common mistake: saying \"particles\" move in\n osmosis. It's always water, and always through a\n partially permeable membrane. Leaving either out can cost a mark.\n### Cells in different solutions\n Outside the cell | Water moves… | Plant cell | Animal cell | \n More dilute than the cell | Into the cell | Swells and becomes firm (turgid). The cell wall stops it bursting. | Swells and may burst | \n Same concentration | No overall movement | No change | No change | \n More concentrated than the cell | Out of the cell | Goes soft (flaccid); the membrane may pull away from the wall | Shrivels | \n## Required practical: osmosis\n Aim: investigate how the concentration of a salt or sugar solution affects the mass of plant tissue.\n PrepareCut equal-sized potato cylinders. Blot them dry and weigh each one.\n SoakPut each cylinder in a different concentration of solution, e.g. 0.0 to 1.0 mol/dm³.\n WaitLeave them for the same time (e.g. 24 hours) at the same temperature.\n Re-weighBlot them dry, weigh them again and calculate the percentage change in mass.\n % change in mass = (final − initial) ÷ initial × 100\n Using % change means you can compare cylinders that started at different masses.\n Plot % change in mass against concentration. Mass goes up in dilute\n solutions and down in concentrated ones. Where the line crosses zero,\n the solution has the same concentration as the potato cells.\n## Active transport\n Active transport moves substances from a more dilute\n solution to a more concentrated solution: against the\n concentration gradient. This needs energy from respiration.\n Root hair cells use it to take in mineral ions from very dilute soil water. Plants need these ions for healthy growth.\n The gut uses it to absorb sugar into the blood, even when there's more sugar in the blood than in the gut. Cells then use the sugar for respiration.\n### Comparing the three processes\n Process | What moves | Direction | Energy? | \n Diffusion | Particles, e.g. oxygen | High → low concentration | No | \n Osmosis | Water, through a partially permeable membrane | Dilute → concentrated solution | No | \n Active transport | e.g. mineral ions, sugar | Low → high concentration | Yes |\nKey words: Osmosis: The diffusion of water from a dilute to a concentrated solution through a partially permeable membrane.; Partially permeable: Lets some substances (like water) through, but not others.; Turgid: Describes a plant cell that is swollen and firm with water.; Active transport: Moving substances against a concentration gradient, using energy from respiration."
